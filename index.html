<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video & PDF</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }
    .container {
      width: min(1100px, 94%);
      margin: 24px auto 40px;
    }
    h1 {
      text-align: center;
      margin: 0 0 18px;
      font-size: 28px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }
    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .pdf-wrapper {
      width: 100%;
      height: 80vh;
      min-height: 600px;
    }
    .pdf-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .download {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      background: #1967d2;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    .download:hover { background: #1557b0; }
    @media (max-width: 600px) {
      .container { width: 96%; margin-top: 12px; }
      h1 { font-size: 22px; }
      .pdf-wrapper { height: 70vh; min-height: 450px; }
      .card { padding: 10px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Video & PDF</h1>

    <section class="card">
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/PYkEyGICEBk"
          title="YouTube video"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <section class="card">
      <div class="pdf-wrapper">
        <iframe src="document.pdf" title="PDF document"></iframe>
      </div>
      <a class="download" href="document.pdf" download>Download PDF</a>
    </section>
  </main>
</body>
</html>
